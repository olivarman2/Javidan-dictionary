workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build Android APK
        script: |
          find . -name "gradlew" -exec chmod +x {} \;
          BUILD_DIR=$(find . -name "gradlew" -exec dirname {} \;)
          cd "$BUILD_DIR"
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/**/*.apk"
