workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build Android APK
        script: |
          cd Javidnam_dictionary-Android-Studio-master || true
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
      - "**/build/outputs/**/*.apk"
